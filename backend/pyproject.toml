[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossroads"
version = "0.1.0"
description = "Crossroads path advisor: deterministic decision engine and two FastAPI services"
requires-python = ">=3.12"
# numpy was in the plan but the engine is Decimal-only and needs no arrays, so it is not added.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "google-genai==2.33.0",  # pinned: thinking_level needs a recent SDK, and image and venv must agree
  "Faker>=30.0",
  "argon2-cffi==25.1.0",  # pinned: the version the tests ran on is the version the image installs
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crossroads = ["db/schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
